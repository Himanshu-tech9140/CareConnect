server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: careconnect-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careconnect}
    username: ${DB_USER:careconnect}
    password: ${DB_PASSWORD:careconnect}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
careconnect:
  demo-seed: ${CARECONNECT_DEMO_SEED:false}
  bootstrap-admin:
    username: ${CARECONNECT_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${CARECONNECT_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${CARECONNECT_BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}
  jwt:
    secret: ${CARECONNECT_JWT_SECRET:careconnect-development-secret-change-me-please}
    ttl-seconds: ${CARECONNECT_JWT_TTL:28800}
